  - date: '2026-09-01'
    rating: 3
    summary: >-
      University-pipeline re-profile. The operator axis was settled before anything was
      saved, and the June 2026 profile turned out to have missed the university's
      strongest institution-operated surface entirely: Hokkaido University runs its own
      SAML 2.0 / Shibboleth identity provider, entityID
      https://shib-idp01.iic.hokudai.ac.jp/idp/shibboleth, scope hokudai.ac.jp,
      registered in the GakuNin national academic federation as PI0008JP since
      2010-03-16, serving live metadata from its own host under a certificate issued to
      O=Hokkaido University. Three further hokudai.ac.jp SAML service providers are
      registered alongside it. Persistent-identifier registrations were verified from
      the registries themselves: Handle naming authority 2115 (administered from
      lib.hokudai.ac.jp, updated 2024-06-24) and JaLC DOI prefix 10.14943 (confirmed via
      the DOI RA resolver and the JaLC API, which names Hokkaido University as
      publisher). The university is not a DataCite member and its only Crossref
      membership is departmental. The OAI-PMH regression first noted in June 2026 was
      re-tested and stands: eighteen candidate paths on the post-migration platform all
      404, while IRDB entry 524 confirms the repository is still harvested, so an
      undocumented endpoint exists. No vendor contract was attributed to the
      institution, and none needed removing — this repo has never carried an OpenAPI.
    endpoints:
      - url: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
        status: 200
        note: GakuNin aggregate, 650 entities, four of them on hokudai.ac.jp hosts.
      - url: https://aidipigakunin2.oicte.hokudai.ac.jp/saml/saml2/idp/metadata.php
        status: 200
