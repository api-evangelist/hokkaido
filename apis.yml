apis:
  - aid: hokkaido:saml-idp
    name: Hokkaido University SAML 2.0 Identity Provider
    x-operator: institution
    description: >-
      Hokkaido University's own Shibboleth/SAML 2.0 identity provider, entityID
      https://shib-idp01.iic.hokudai.ac.jp/idp/shibboleth, scope hokudai.ac.jp,
      registered in the GakuNin national academic federation since 2010-03-16. The
      SAML metadata document is served from the university's own host and the signing
      certificate is issued to O=Hokkaido University by the NII Open Domain CA. This is
      the strongest institution-operated machine-readable surface the university has.
    humanURL: https://www.iic.hokudai.ac.jp/
    baseURL: https://aidipigakunin2.oicte.hokudai.ac.jp/saml/saml2/idp/metadata.php
    tags: [Identity Federation, SAML, Shibboleth, GakuNin, Authentication]
    properties:
      - type: Authentication
        url: authentication/hokkaido-saml-idp.yml
      - type: Conformance
        url: conformance/hokkaido-conformance.yml
  - aid: hokkaido:gakunin
    name: GakuNin Academic Access Management Federation
    x-operator: federation
    description: >-
      Membership of GakuNin (学術認証フェデレーション), the Japanese national academic identity
      federation operated by the National Institute of Informatics. The aggregate at
      metadata.gakunin.nii.ac.jp carries 650 entities, four of them Hokkaido
      University's — one identity provider and three service providers (RISS, WeBWorK,
      MDS Platform), all on hokudai.ac.jp hosts. Recorded as a relationship: the
      federation aggregate is NII's document, shared by definition, and the identity
      provider behind Hokkaido's entry is the university's own.
    humanURL: https://www.gakunin.jp/
    baseURL: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    tags: [Identity Federation, SAML, Metadata, GakuNin, Japan]
    properties:
      - type: Authentication
        url: authentication/hokkaido-saml-idp.yml
  - aid: hokkaido:huscap-sitemap
    name: HUSCAP XML Sitemaps
    x-operator: institution
    description: >-
      Publicly crawlable XML sitemap index for HUSCAP, the Hokkaido University
      Collection of Scholarly and Academic Papers, providing a machine-readable list of
      repository item URLs across seven child sitemaps refreshed daily. Explicitly
      permitted by the repository's robots.txt, which otherwise disallows crawling.
      The only machine-readable interface HUSCAP currently offers.
    humanURL: https://eprints.lib.hokudai.ac.jp/
    baseURL: https://eprints.lib.hokudai.ac.jp/sitemap/sitemapindex.xml
    tags: [Sitemap, XML, Discovery, Open Access, Research Repository]
    properties:
      - type: Documentation
        url: https://www.lib.hokudai.ac.jp/support/huscap/
      - type: RobotsTxt
        url: https://eprints.lib.hokudai.ac.jp/robots.txt
  - aid: hokkaido:web-sitemaps
    name: Hokkaido University Web Sitemaps
    x-operator: institution
    description: >-
      XML sitemaps for the university's two public web estates — the 2.4 MB
      sitemap.xml on the Japanese site and the WordPress core sitemap index on the
      English global site. Machine-readable and institution-operated, though the
      WordPress REST API behind the English site is explicitly disabled and returns
      {"code":"rest_disabled"}.
    humanURL: https://www.hokudai.ac.jp/
    baseURL: https://www.hokudai.ac.jp/sitemap.xml
    tags: [Sitemap, XML, Discovery, Website]
    properties:
      - type: Sitemap
        url: https://www.global.hokudai.ac.jp/wp-sitemap.xml
  - aid: hokkaido:handle-2115
    name: Handle System Prefix 2115
    x-operator: registry
    description: >-
      Hokkaido University Library holds Handle System naming authority prefix 2115,
      which mints the persistent identifiers on every HUSCAP record (hdl.handle.net/2115/…).
      Registered since 2005 and administratively current — the naming-authority record
      carries contact addresses at lib.hokudai.ac.jp, most recently updated 2024-06-24.
      Recorded as a registry membership: the Handle System's own contract belongs to the
      DONA Foundation, the registration is a fact about Hokkaido University.
    humanURL: https://hdl.handle.net/2115/301
    baseURL: https://hdl.handle.net/api/handles/0.NA/2115
    tags: [Persistent Identifiers, Handle, Registry, Research Repository]
  - aid: hokkaido:jalc-doi-10-14943
    name: JaLC DOI Prefix 10.14943
    x-operator: registry
    description: >-
      Hokkaido University registers DOIs through JaLC, the Japan Link Center, under
      prefix 10.14943. Confirmed from the DOI Registration Agency resolver
      (doi.org/doiRA/10.14943 returns RA "JaLC"), from the Handle naming-authority
      record for 10.14943 which delegates to service 10.SERV/JALC, and from the JaLC
      DOI API, which returns publisher_list "Hokkaido University" / "北海道大学" for a
      live HUSCAP DOI. The university library states explicitly that HUSCAP mints JaLC
      DOIs and cannot mint DataCite or Crossref DOIs.
    humanURL: https://www.lib.hokudai.ac.jp/support/huscap_doi/
    baseURL: https://api.japanlinkcenter.org/dois/10.14943/bfhhs.165.l129
    tags: [Persistent Identifiers, DOI, JaLC, Registry, Open Access]
    properties:
      - type: Conformance
        url: conformance/hokkaido-conformance.yml
  - aid: hokkaido:ror
    name: ROR Registry Record
    x-operator: registry
    description: >-
      Research Organization Registry record https://ror.org/02e16g702, types education
      and funder, established 1876, located Sapporo, Japan. Carries the university's
      cross-registry identifiers — Crossref Funder ID 501100005946, GRID grid.39158.36,
      ISNI 0000 0001 2173 7691, Wikidata Q1057199. Recorded as a registry membership;
      the ROR API contract is ROR's.
    humanURL: https://ror.org/02e16g702
    baseURL: https://api.ror.org/organizations/https%3A%2F%2Fror.org%2F02e16g702
    tags: [Registry, Identifiers, ROR, Research]
  - aid: hokkaido:crossref-5618
    name: Crossref Member 5618 — Department of Mathematics
    x-operator: registry
    description: >-
      Crossref membership held at department level, not institution level. Member 5618,
      "Department of Mathematics, Hokkaido University", prefix 10.14492, 1,820
      registered DOIs. Recorded because it is real and current, and scoped precisely
      because the institutional repository explicitly does not mint Crossref DOIs.
    humanURL: https://www.math.sci.hokudai.ac.jp/
    baseURL: https://api.crossref.org/members/5618
    tags: [Registry, Identifiers, Crossref, DOI, Research]
  - aid: hokkaido:syllabus
    name: Hokkaido University Syllabus Search (学務システム)
    x-operator: institution
    description: >-
      Public course catalog and syllabus search, institution-operated on the
      gakumu.academic.hokudai.ac.jp host. Live and open to the public, but web-only —
      an ASP.NET WebForms application with no documented programmatic interface, no
      sitemap and no machine-readable course export. The older
      syllabus01.academic.hokudai.ac.jp system it replaced no longer resolves. Recorded
      as a surface class the institution genuinely runs, with the absence of a
      machine-readable contract stated rather than implied.
    humanURL: https://gakumu.academic.hokudai.ac.jp/Portal/Public/Syllabus/SearchMain.aspx
    tags: [Course Catalog, Syllabus, Registrar, Web Only]
  - aid: hokkaido:hucc
    name: Interdisciplinary Large-scale Computing System (HUCC)
    x-operator: institution
    description: >-
      The Information Initiative Center's supercomputer and research cloud service —
      Grand Chariot 2 and the research cloud system — documented in Japanese and
      English with a published application and allocation process. Institution-operated
      research computing. No service catalog API, allocation API or job-submission API
      is publicly documented; access is applied for through a user portal that requires
      institutional affiliation.
    humanURL: https://www.hucc.hokudai.ac.jp/en/overview/ilcs/
    tags: [Research Computing, HPC, Supercomputing, Web Only]
