  generated: '2026-09-01'
  method: probed
  detail: >-
    Every surface class the university pipeline hunts was probed live on 2026-09-01 and
    the result is a thin but complete and honest profile. Hokkaido University publishes
    no public REST API, no developer portal and no API gateway: api., data., opendata.,
    developer. and status.hokudai.ac.jp do not resolve, /llms.txt, /.well-known/apis.json,
    /.well-known/security.txt and /.well-known/openid-configuration all 404, and the
    WordPress REST API on the English global site answers {"code":"rest_disabled"}. What
    the institution genuinely operates is scholarly identity infrastructure, and that is
    what this profile now records. Its own SAML 2.0 / Shibboleth identity provider is
    registered in GakuNin as PI0008JP with scope hokudai.ac.jp, serves its metadata from
    a hokudai.ac.jp host under a certificate issued to O=Hokkaido University, and answers
    on its advertised SSO endpoint — the strongest institution-operated surface here and
    one the June 2026 profile missed entirely. Three further hokudai.ac.jp SAML service
    providers are registered alongside it. Persistent-identifier registrations were
    verified from the registries themselves rather than from university prose: Handle
    naming authority 2115, administered from lib.hokudai.ac.jp and updated 2024-06-24,
    and JaLC DOI prefix 10.14943, confirmed through the DOI RA resolver and the JaLC API
    which names Hokkaido University as publisher. The university is NOT a DataCite member
    — api.datacite.org returns zero clients and the library states the position
    explicitly — and its only Crossref membership is departmental (member 5618,
    Department of Mathematics, prefix 10.14492). The one real regression is OAI-PMH: IRDB
    entry 524 still harvests HUSCAP, so a base URL exists, but the legacy DSpace endpoint
    has 404ed since the December 2025 platform migration and eighteen candidate paths on
    the replacement platform were probed without success. No vendor contract was saved
    under this institution's name, and none was found to remove — the repo carried no
    OpenAPI at all before this run.
