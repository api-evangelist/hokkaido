aid: hokkaido
name: Hokkaido University
x-type: university
x-category: Public Research University
description: >-
  Hokkaido University (北海道大学) is a national research university in Sapporo, Japan,
  founded in 1876 as Sapporo Agricultural College, a member of Japan's Designated
  National University group and ranked #173 in the QS World University Rankings 2025.
  It operates 12 undergraduate schools, 21 graduate schools and numerous research
  institutes. Its public programmable footprint is small and honest: the university
  publishes no developer portal, no API gateway and no documented public REST API —
  api., data., opendata., developer. and status.hokudai.ac.jp all fail to resolve, and
  the WordPress REST API on its English site is explicitly disabled. What it does
  operate, and what this profile is built on, is scholarly identity infrastructure. It
  runs its own SAML 2.0 / Shibboleth identity provider registered in GakuNin, the
  Japanese national academic access federation; it holds Handle System prefix 2115 and
  JaLC DOI prefix 10.14943 for the HUSCAP institutional repository; and it publishes
  crawlable XML sitemaps for both HUSCAP and its main web estate. HUSCAP's OAI-PMH
  endpoint is the one real regression: IRDB still harvests the repository by OAI-PMH,
  but no base URL has been publicly documented since the December 2025 platform
  migration and eighteen candidate paths were probed unsuccessfully.
