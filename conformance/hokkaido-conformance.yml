---
# authorship: generated by API Evangelist during the university pipeline
# run of 2026-09-01. Every claim below was probed live against a machine-readable
# surface. Reward-only: a standard the institution does not demonstrably implement
# is recorded as not-conformant with the negative probe that establishes it, and is
# never credited.
generated: '2026-09-01'
method: probed
source: >-
  Live probes of the GakuNin federation aggregate, Hokkaido University's own SAML
  metadata endpoint, the Handle System REST API, the DOI Registration Agency
  resolver, the Japan Link Center DOI API, the ROR API, the Crossref API and the
  DataCite API, all on 2026-09-01.
provider: Hokkaido University
providerId: hokkaido
regime: education
description: >-
  Domain-standard conformance for Hokkaido University, measured against the Kin Score
  `education` regulatory regime standards list (scim, lti, oneroster, ed-fi, caliper,
  qti, oai-pmh, shibboleth, saml, orcid, datacite, crossref). Hokkaido University's
  demonstrable conformance is concentrated entirely in scholarly identity and access
  infrastructure. It operates its own Shibboleth/SAML identity provider inside the
  Japanese national academic federation, and it is a registrant in the Handle System
  and in JaLC, Japan's national DOI registration agency. It is NOT a DataCite member —
  the university library states this explicitly — and its Crossref membership is
  departmental rather than institution-wide. OAI-PMH is the notable gap: IRDB harvests
  HUSCAP by OAI-PMH, so a base URL must exist, but it has not been publicly documented
  or discoverable since the repository's December 2025 platform migration.

conformance:

- standard: shibboleth
  name: Shibboleth / GakuNin academic access management federation
  status: conformant
  operator: institution
  evidence:
    location: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    status: 200
    detail: >-
      The GakuNin aggregate (5.65 MB, 650 EntityDescriptors) carries EntityDescriptor
      ID "PI0008JP", entityID https://shib-idp01.iic.hokudai.ac.jp/idp/shibboleth, with
      an IDPSSODescriptor, mdui:DisplayName "北海道大学" / "Hokkaido University",
      shibmd:Scope regexp="false" hokudai.ac.jp, and mdrpi:RegistrationInfo
      registrationAuthority https://www.gakunin.jp registered 2010-03-16.
  supporting:
  - location: https://aidipigakunin2.oicte.hokudai.ac.jp/saml/saml2/idp/metadata.php
    status: 200
    detail: >-
      Hokkaido University serves the same EntityDescriptor from its own host, so the
      IdP metadata is first-party and not only present in the federation aggregate.
  - location: https://aidipigakunin2.oicte.hokudai.ac.jp/saml/saml2/idp/SSOService.php
    status: 200
    detail: The advertised SingleSignOnService endpoint answers, so the IdP is live and not merely registered.
  note: >-
    Three further hokudai.ac.jp SAML Service Providers are registered in the same
    aggregate — RISS, WeBWorK and MDS Platform — all on the institution's own domain.

- standard: saml
  name: SAML 2.0 Web Browser SSO
  status: conformant
  operator: institution
  evidence:
    location: https://aidipigakunin2.oicte.hokudai.ac.jp/saml/saml2/idp/metadata.php
    status: 200
    detail: >-
      Valid SAML 2.0 EntityDescriptor with IDPSSODescriptor
      protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol", HTTP-Redirect
      and HTTP-POST SingleSignOnService bindings, HTTP-Redirect and HTTP-POST
      SingleLogoutService bindings, transient NameID format, and an X.509 signing
      certificate issued to O=Hokkaido University by the NII Open Domain CA - G8 RSA
      (valid 2026-01-29 to 2027-03-01).

- standard: oai-pmh
  name: Open Archives Initiative Protocol for Metadata Harvesting 2.0
  status: not-conformant
  operator: institution
  evidence:
    location: https://eprints.lib.hokudai.ac.jp/dspace-oai/request?verb=Identify
    status: 404
    detail: >-
      The legacy DSpace OAI-PMH base URL has returned 404 since HUSCAP's December 2025
      platform migration. Twelve further candidate paths on the replacement platform
      were probed on 2026-09-01 — /cgi/oai2, /oai, /oai2, /OAI, /oai/request,
      /oai/index.php, /oai.php, /oaipmh, /oai-pmh, /oai/huscap, /oai/repo/huscap,
      /repo/huscap/oai, /repo/huscap/all/oai, /repo/huscap/all/oai/request,
      /repo/oai/huscap, /huscap/oai, /huscap/oai/request, /media7/oai — and every one
      returned 404.
  supporting:
  - location: https://irdb.nii.ac.jp/repositorylist?page=10
    status: 200
    detail: >-
      IRDB entry 524 lists 北海道大学 / 北海道大学学術成果コレクション at
      https://eprints.lib.hokudai.ac.jp/ with DOI prefix 10.14943. IRDB harvests only
      by OAI-PMH, so an endpoint exists; it is simply not published, linked from the
      repository, or referenced in the library's HUSCAP documentation.
  note: >-
    Recorded as not-conformant on the evidence available, not as absent. This is a
    documentation and discoverability failure rather than a capability gap, and it is
    the single highest-value thing Hokkaido University could fix.

- standard: datacite
  name: DataCite DOI registration
  status: not-conformant
  operator: institution
  evidence:
    location: https://api.datacite.org/clients?query=hokkaido
    status: 200
    detail: 'Returns meta.total 0 — no DataCite client is registered for Hokkaido University.'
  supporting:
  - location: https://www.lib.hokudai.ac.jp/support/huscap_doi/
    status: 200
    detail: >-
      Hokkaido University Library states the position directly:
      「HUSCAPではジャパンリンクセンターが提供するDOI（JaLC DOI）を付与することができます。
      ※DataCite DOI、CrossRef DOIは付与できません。」 — HUSCAP mints JaLC DOIs, and
      DataCite and Crossref DOIs cannot be assigned.
  note: >-
    Absence here is a deliberate institutional choice, not an oversight. Japanese
    institutional repositories register through JaLC, the national DOI RA, which is not
    named in the education regime standards list.

- standard: crossref
  name: Crossref DOI registration
  status: partial
  operator: institution
  evidence:
    location: https://api.crossref.org/members/5618
    status: 200
    detail: >-
      Crossref member 5618, primary-name "Department of Mathematics, Hokkaido
      University", location Japan, prefix 10.14492, 1,820 registered DOIs.
  note: >-
    Real and current, but departmental. There is no institution-wide Crossref
    membership, and the university's institutional repository explicitly does not mint
    Crossref DOIs. Scored as partial for that reason.

- standard: orcid
  name: ORCID researcher identifiers
  status: not-conformant
  operator: registry
  evidence:
    location: 'https://pub.orcid.org/v3.0/expanded-search/?q=affiliation-org-name:%22Hokkaido%20University%22&rows=1'
    status: 200
    detail: >-
      6,346 ORCID records carry an employment or education affiliation naming Hokkaido
      University. That is a fact about the university's researchers, established from
      ORCID's own public API.
  note: >-
    Deliberately NOT credited as institutional conformance. Affiliation records are
    written by individual researchers into ORCID; no Hokkaido-operated surface was
    found that asserts, consumes or resolves ORCID iDs. Crediting the count here would
    be crediting the institution for something 6,346 other people did.

- standard: scim
  status: not-conformant
  evidence:
    location: https://www.hokudai.ac.jp/.well-known/openid-configuration
    status: 404
    detail: No SCIM, OIDC discovery, or provisioning surface was found on any hokudai.ac.jp host.

- standard: lti
  status: not-conformant
  evidence:
    location: https://elms.hokudai.ac.jp/
    status: 0
    detail: >-
      The ELMS learning management system host does not resolve publicly, so no LTI 1.3
      JWKS, tool configuration, or platform registration endpoint is externally probeable.

notEvaluated:
- oneroster
- ed-fi
- caliper
- qti
notEvaluatedReason: >-
  These four standards describe K-12 and course-data interoperability surfaces. Hokkaido
  University exposes no student-information, roster, or assessment API publicly, so there
  is no surface against which to probe them. Recorded as not evaluated rather than as
  failures.

