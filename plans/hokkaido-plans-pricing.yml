description: >-
  Hokkaido University is a national university corporation and does not sell API access.
  No public REST API, developer portal or API gateway exists, so there is no commercial
  plan to record. The surfaces that are open — HUSCAP's XML sitemap index and the
  university web sitemaps — are free and unmetered. Everything else is gated by
  institutional identity through the university's GakuNin-registered SAML identity
  provider rather than by payment.
notes: >-
  "Free / Open" reflects the crawlable sitemap surfaces only. "Affiliation /
  Credentialed" reflects access gated by SAML federation membership, not by a paid tier.
  Probed 2026-09-01; no pricing page, plan page or billing document was found on any
  hokudai.ac.jp host.
